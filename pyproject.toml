[project]
name = "intervals-mcp"
version = "0.1.0"
description = "MCP local para publicar treinos no Intervals.icu (sincroniza com Garmin)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
intervals-mcp = "intervals_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intervals_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
